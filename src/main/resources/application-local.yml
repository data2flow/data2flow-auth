# 로컬 개발. 인프라는 s3 SSH 터널·공용 개발 DB로 붙는다(design/deployment.md §8.2). 비밀값은 루트 .env
# Redis: SSH 터널 localhost:6379(DATA2FLOW_REDIS_*). core-api는 DATA2FLOW_CORE_URI(예: http://localhost:8082)
# 서명 키: DATA2FLOW_AUTH_JWT_KEYS="local:<openssl rand -base64 32>" — 개발자마다 따로 만들고 저장소에 넣지 않는다
spring:
  config:
    import: optional:file:../.env[.properties]
logging:
  level:
    net.java21.data2flow: DEBUG
